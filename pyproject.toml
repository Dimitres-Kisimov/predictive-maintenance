[project]
name = "pdm"
version = "0.1.0"
description = "Sensor anomaly detection + CP-SAT maintenance scheduling on synthetic plant data"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
