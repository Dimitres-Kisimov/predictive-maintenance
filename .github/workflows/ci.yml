name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas matplotlib openpyxl ortools ruff pytest
      # torch is installed best-effort from the official CPU wheel index.
      # If this step ever fails (wheel availability changes), the AE tests
      # skip via pytest.importorskip("torch") and the numpy-based suite
      # (data, features, PCA detector, health, scheduling, exports) still
      # gates the build.
      - name: Install torch (CPU wheel, best-effort)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu || echo "torch unavailable; AE tests will be skipped"
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
